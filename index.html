<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Nossa História 💕</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Caveat:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Poppins',sans-serif;background:radial-gradient(circle at center,#2a1b12 0%,#050302 100%);margin:0}
body{display:flex;flex-direction:column;align-items:center;justify-content:center}
html::-webkit-scrollbar{display:none}

.wrap{perspective:1500px;position:relative;transition:width .8s,height .8s;user-select:none}
.wrap.closed #s0{width:100%}
.wrap.closed .spread:not(#s0){visibility:hidden}
.book{position:relative;width:100%;height:100%;transform-style:preserve-3d}

.spread{position:absolute;top:0;right:0;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;transition:transform 1.2s cubic-bezier(.4,.05,.2,1)}
.spread.flip{transform:rotateY(-180deg)}

.sf,.sb{position:absolute;inset:0;backface-visibility:hidden;overflow:hidden}
.sf{z-index:2}
.sb{transform:rotateY(180deg)}

.page{position:absolute;height:94%;width:96%;top:3%;display:flex;flex-direction:column;align-items:center;padding:1.4rem 1.2rem;overflow:hidden}
.page .pg-grid{flex:1 1 0;min-height:0;overflow:hidden}
.page .pm{flex-shrink:0;z-index:3}
.page .ltr{flex-shrink:0;z-index:3}
.page .pt{flex-shrink:0;z-index:3}
.page-r{left:0;border-radius:0 4px 4px 0;background:url('assets/paper.png') center/cover;box-shadow:inset 30px 0 40px -10px rgba(0,0,0,0.3)}
.page-l{right:0;border-radius:4px 0 0 4px;background:url('assets/paper.png') center/cover;box-shadow:inset -30px 0 40px -10px rgba(0,0,0,0.3)}
.page.romantic.page-r{background:url('assets/paper.png') center/cover}
.page.romantic.page-l{background:url('assets/paper.png') center/cover}

.sf::after{content:'';position:absolute;top:0;left:0;bottom:0;width:25px;background:linear-gradient(to right,rgba(0,0,0,.05),transparent);pointer-events:none;z-index:10}
.sb::after{content:'';position:absolute;top:0;right:0;bottom:0;width:25px;background:linear-gradient(to left,rgba(0,0,0,.05),transparent);pointer-events:none;z-index:10}

.cover-pg{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fdf6ee;padding:2rem;background:url('assets/leather.png') center/cover;position:relative;overflow:hidden;width:100%;height:100%}
.cover-pg.front-c{border-radius:0 4px 4px 0}
.cover-pg.back-c{border-radius:4px 0 0 4px}
.cover-pg::before{content:'';position:absolute;inset:8px;border:2px dashed rgba(255,255,255,0.4);pointer-events:none;box-shadow:inset 0 0 10px rgba(0,0,0,0.5)}
.cover-inside{position:absolute;inset:0;background:url('assets/leather.png') center/cover;box-shadow:inset 0 0 50px rgba(0,0,0,0.9)}
.cover-inside::before{content:'';position:absolute;inset:8px;border:2px dashed rgba(255,255,255,0.4);pointer-events:none}
.ci-r{box-shadow:inset 0 0 50px rgba(0,0,0,0.9),1px 1px 0px #2a170d,2px 2px 0px #1a0e07,3px 3px 6px rgba(0,0,0,0.6)}
.ci-l{box-shadow:inset 0 0 50px rgba(0,0,0,0.9),-1px 1px 0px #2a170d,-2px 2px 0px #1a0e07,-3px 3px 6px rgba(0,0,0,0.6)}
.gold-corner{position:absolute;width:45px;height:45px;background:url('assets/gold.png') center/cover;box-shadow:inset 1px 1px 2px rgba(255,255,255,0.4),inset -1px -1px 3px rgba(0,0,0,0.7),2px 2px 5px rgba(0,0,0,0.8);z-index:10}
.corner-tl{top:0;left:0;clip-path:polygon(0 0,100% 0,0 100%)}
.corner-tr{top:0;right:0;clip-path:polygon(0 0,100% 0,100% 100%)}
.corner-bl{bottom:0;left:0;clip-path:polygon(0 0,100% 100%,0 100%)}
.corner-br{bottom:0;right:0;clip-path:polygon(100% 0,100% 100%,0 100%)}

.cn{font-family:'Dancing Script',cursive;font-size:clamp(2rem,6vw,3.2rem);font-weight:700;text-shadow:2px 3px 6px rgba(0,0,0,.4);position:relative;color:#f0e68c}
.cd{width:90px;height:2px;margin:.7rem auto;background:linear-gradient(90deg,transparent,#fdf6ee,transparent);position:relative}
.ct{font-family:'Caveat',cursive;font-size:clamp(1.2rem,4vw,1.8rem);opacity:.9;position:relative}
.cs{font-size:.8rem;opacity:.6;margin-top:.3rem;font-style:italic;position:relative}
.co{font-size:1.5rem;opacity:.5;letter-spacing:.6rem;margin-bottom:.6rem;position:relative}
.bo{margin-top:1.3rem;padding:.6rem 1.5rem;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.4);color:#fdf6ee;font-family:'Poppins',sans-serif;font-size:.85rem;border-radius:50px;cursor:pointer;transition:all .3s;position:relative;display:inline-flex;align-items:center;gap:.4rem;animation:gl 2s infinite}
.bo:hover{background:rgba(255,255,255,.3);transform:scale(1.05)}
@keyframes gl{0%,100%{box-shadow:0 0 8px rgba(255,255,255,.2)}50%{box-shadow:0 0 20px rgba(255,255,255,.4)}}

.page-lighting{position:absolute;inset:0;pointer-events:none;z-index:100;mix-blend-mode:multiply;opacity:0}
.left-lighting{background:linear-gradient(to right,rgba(0,0,0,0) 0%,rgba(0,0,0,0.1) 30%,rgba(0,0,0,0.3) 50%,rgba(0,0,0,0) 100%);background-size:200% 100%;animation:sweepLeft 1.2s ease-in-out}
.right-lighting{background:linear-gradient(to right,rgba(0,0,0,0) 0%,rgba(0,0,0,0.3) 50%,rgba(0,0,0,0.1) 70%,rgba(0,0,0,0) 100%);background-size:200% 100%;animation:sweepRight 1.2s ease-in-out}
.page-highlight{position:absolute;inset:0;pointer-events:none;z-index:101;mix-blend-mode:overlay;opacity:0}
.left-highlight{background:linear-gradient(to right,rgba(255,255,255,0) 0%,rgba(255,255,255,0.4) 45%,rgba(255,255,255,0.8) 50%,rgba(255,255,255,0.4) 55%,rgba(255,255,255,0) 100%);background-size:200% 100%;animation:sweepLeft 1.2s ease-in-out}
.right-highlight{background:linear-gradient(to right,rgba(255,255,255,0) 0%,rgba(255,255,255,0.4) 45%,rgba(255,255,255,0.8) 50%,rgba(255,255,255,0.4) 55%,rgba(255,255,255,0) 100%);background-size:200% 100%;animation:sweepRight 1.2s ease-in-out}
@keyframes sweepLeft{0%{opacity:0;background-position:100% 0}20%{opacity:0.8}80%{opacity:0.8}100%{opacity:0;background-position:-100% 0}}
@keyframes sweepRight{0%{opacity:0;background-position:-100% 0}20%{opacity:0.8}80%{opacity:0.8}100%{opacity:0;background-position:100% 0}}

/* Back cover overlay */
.backcover{position:absolute;top:0;width:50%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fdf6ee;padding:2rem;background:url('assets/leather.png') center/cover;border-radius:6px;z-index:10000;opacity:0;pointer-events:none;left:50%}
.backcover::before{content:'';position:absolute;inset:0;border-radius:6px}
.backcover.show{opacity:1;pointer-events:auto}

.spine{position:absolute;left:50%;top:0;bottom:0;width:6px;margin-left:-3px;background:linear-gradient(90deg,#2a1508,#4a2a15,#2a1508);z-index:9999;border-radius:1px;box-shadow:-2px 0 6px rgba(0,0,0,.4),2px 0 6px rgba(0,0,0,.4);opacity:0;transition:opacity .5s;pointer-events:none;transform-style:flat}
.spine.show{opacity:1}

.tape{display:none}
.t1{top:8px;left:8px}
.t2{top:8px;right:8px}

.pt{font-family:'Dancing Script',cursive;font-size:clamp(1.2rem,3.5vw,1.8rem);color:#2a1b12;margin-bottom:.4rem;text-align:center;font-weight:700}

.pg-grid{display:grid;gap:.4rem;width:100%;margin-bottom:.4rem;grid-auto-rows:minmax(0,1fr)}
/* Page layout styles */
.ly-a .pg-grid{grid-template-columns:1fr;gap:.6rem}
.ly-b .pg-grid{grid-template-columns:1fr 1fr;gap:.6rem}
@media(max-width:500px){.ly-b .pg-grid{grid-template-columns:1fr}}
.ly-c .pg-grid{grid-template-columns:1fr;gap:.5rem}
.ly-c .fr:nth-child(2){margin:0 12% 0 12%}
.ly-d .pg-grid{grid-template-columns:1fr 1fr;gap:.5rem;align-items:end}
@media(max-width:500px){.ly-d .pg-grid{grid-template-columns:1fr}}
.ly-d .fr:nth-child(2){margin-top:-10%}
.ly-e .pg-grid{grid-template-columns:1fr;gap:.5rem}
.ly-e .fr{aspect-ratio:1;width:100%;max-width:65%;max-height:100%;margin:0 auto}
.ly-e .fr:nth-child(2){width:100%;max-width:65%;max-height:100%;margin:0 0 0 auto}
@media(max-width:500px){.ly-e .fr,.ly-e .fr:nth-child(2){width:90%}}
.ly-e .fr>img, .ly-e .fr video{width:100%;height:100%;object-fit:cover;border-radius:50%}

.ly-f .pg-grid{grid-template-columns:1fr;gap:.5rem}
.ly-f .fr:nth-child(2){margin-left:8%}
.ly-g .pg-grid{grid-template-columns:1fr;gap:0}
.ly-g .fr:nth-child(2){margin-top:-15%;margin-left:25%}
.ly-h .pg-grid{grid-template-columns:1fr;gap:.5rem}
.ly-i .pg-grid{grid-template-columns:1fr 1fr;gap:.4rem}
@media(max-width:500px){.ly-i .pg-grid{grid-template-columns:1fr}}
.ly-j .pg-grid{grid-template-columns:1fr;gap:.4rem}
.ly-k .pg-grid{grid-template-columns:1fr;gap:.5rem}
.ly-k .fr:nth-child(odd){margin-right:15%}
.ly-k .fr:nth-child(even){margin-left:15%}
.ly-l .pg-grid{grid-template-columns:1fr;gap:.5rem}

.fr{overflow:visible;transition:transform .4s;padding:0;position:relative;background:transparent;display:flex;align-items:center;justify-content:center;min-height:0;min-width:0}
.fr:hover{transform:scale(1.02)!important;z-index:2}
.fr>img{width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain;display:block;position:relative;z-index:1;background:#fff;border:4px solid #fdfaf6;border-radius:4px;box-shadow:2px 3px 6px rgba(0,0,0,0.4)}
.fr video{width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain;display:block;background:#000;border:4px solid #fdfaf6;border-radius:4px;box-shadow:2px 3px 6px rgba(0,0,0,0.4);filter:grayscale(1);transition:filter .5s;z-index:1}
.fr video.playing{filter:grayscale(0)}
.fr::after{display:none}
.fr .bb{display:none}
.tl{transform:rotate(-2deg)}.tr{transform:rotate(2deg)}

.pm{font-family:'Caveat',cursive;font-size:clamp(.9rem,2.2vw,1.1rem);color:#1a0f08;text-align:left;line-height:1.4;min-height:1rem;width:100%;text-indent:1.5em;position:relative;font-weight:700}
.pm .pm-reserve{visibility:hidden}
.pm .pm-text{position:absolute;top:0;left:0;width:100%;text-indent:1.5em}
.cur{display:inline-block;width:2px;height:1em;background:#1a0f08;margin-left:1px;animation:bk .7s infinite;vertical-align:text-bottom}
@keyframes bk{0%,100%{opacity:1}50%{opacity:0}}

.ltr{background:rgba(255,255,255,.5);border:1px dashed #d4a0c0;border-radius:6px;padding:.5rem;width:100%}
.ltr .pm{font-size:clamp(.68rem,1.6vw,.82rem);text-align:left}

.et{font-family:'Dancing Script',cursive;font-size:1.3rem;color:#fdf6ee;position:relative}
.ee{font-size:1.6rem;margin-top:.6rem;position:relative}

.nav{display:flex;align-items:center;gap:.7rem;margin-top:.7rem;z-index:200}
.nb{width:44px;height:44px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s;color:#ccc}
.nb:hover:not(:disabled){background:rgba(255,255,255,.2);color:#fff;transform:scale(1.1)}
.nb:disabled{opacity:.15;cursor:default}
.pi{font-family:'Caveat',cursive;font-size:1rem;color:rgba(255,255,255,.6);min-width:100px;text-align:center}

.ctrl{position:fixed;top:.7rem;right:.7rem;z-index:200;display:flex;gap:.4rem}
.cb{width:38px;height:38px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.15);border-radius:50%;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s;color:#fff}
.cb:hover{background:rgba(255,255,255,.25);transform:scale(1.1)}
.cb.on{background:rgba(212,160,192,.3)}

.bsh{width:70%;height:20px;background:radial-gradient(ellipse,rgba(0,0,0,.3),transparent);border-radius:50%;filter:blur(5px);margin-top:.2rem}

.page::-webkit-scrollbar{width:3px}
.page::-webkit-scrollbar-thumb{background:#d4c0a8;border-radius:3px}

@media(max-width:600px){
  .page{padding:.8rem .5rem}
  .tape{width:34px;height:12px}
  .pg-grid{gap:.3rem}
  .g3{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<div class="wrap" id="wrap">
  <div class="backcover" id="bc">
    <div style="position:relative">
      <p class="et">Nossa História</p>
      <p class="ee">💕</p>
    </div>
    <button class="bo" style="animation:none;position:relative;margin-top:1.3rem" id="bReopen">Voltar ao início</button>
  </div>
  <div class="spine" id="spine"></div>
  <div class="book" id="book"></div>
</div>
<div id="nav" style="display:none"><span id="pi" class="pi"></span></div>
<button id="bp" style="display:none" disabled></button>
<button id="bn" style="display:none"></button>
<div class="ctrl" id="ctrl" style="visibility:hidden">
  <button id="bm" class="cb" title="Música">🎵</button>
  <button id="br" class="cb" title="Reiniciar">🔄</button>
</div>
<audio id="aud" loop preload="auto"><source src="musica/musica.mp3" type="audio/mpeg"></audio>

<script>
var D=[
{t:'Infância 👶',r:0,f:{p:['fotos/foto (1).jpg','fotos/foto (2).jpg'],ly:'a',m:'Desde pequenininha, já era a pessoa mais especial desse mundo. Seus olhos brilhavam com a mesma luz que ilumina minha vida até hoje. 💛'},b:{p:['fotos/foto (3).jpg','fotos/foto (4).jpg'],ly:'b',m:'Cada sorriso seu de criança já prometia a mulher incrível que você se tornaria. ✨'}},
{t:'Adolescência 🌸',r:0,f:{p:['fotos/foto (5).jpg','fotos/foto (6).jpg'],ly:'l',m:'Crescendo, sonhando, se descobrindo... Cada fase sua foi linda de se ver. Você sempre foi cheia de luz e coragem. 🌟'},b:{p:['fotos/foto (7).jpg','fotos/foto (8).jpg'],ly:'b',m:'Seus sonhos de adolescente se transformaram em realidade. E eu tenho a sorte de fazer parte dessa história. 💫'}},
{t:'Juventude 🌻',r:0,f:{p:['fotos/foto (9).jpg','fotos/foto (10).jpg'],ly:'k',m:'Momentos que marcaram, conquistas que inspiraram. Você sempre foi forte, determinada e linda em tudo que faz. 🔥'},b:{p:['fotos/foto (11).JPG','fotos/foto (12).jpg'],ly:'e',m:'A vida te preparou para ser essa pessoa maravilhosa. E o melhor ainda estava por vir... 💕'}},
{t:'Nosso Encontro 💘',r:1,f:{p:['fotos/foto (13).jpg','fotos/foto (14).jpg'],ly:'c',m:'O dia em que nossos caminhos se cruzaram foi o dia mais especial da minha vida. Desde o primeiro olhar, eu soube que era você. 💗'},b:{p:['fotos/foto (15).jpg','fotos/foto (16).jpg'],ly:'i',m:'Você chegou e coloriu meu mundo inteiro. Obrigado por escolher caminhar ao meu lado. ❤️'}},
{t:'Nossa História 📖',r:0,f:{p:['fotos/foto (17).jpg','fotos/foto (18).JPG'],ly:'f',m:'Cada momento juntos é um tesouro. Risadas, abraços, viagens, e até as dificuldades nos fizeram mais fortes. 🌈'},b:{p:['fotos/foto (19).jpg','fotos/foto (20).JPG'],ly:'j',m:'8 anos de memórias que cabem no coração mas não cabem em palavras. Cada dia com você é uma nova aventura. 💞'}},
{t:'Nossos Momentos 🎬',r:1,f:{p:['videos/video1.mp4'],ly:'g',m:'Alguns momentos são tão especiais que merecem ser guardados em movimento. Cada segundo ao seu lado é um filme que eu nunca canso de assistir. 🎥'},b:{p:['videos/video2.mp4'],ly:'g',m:'O melhor da nossa história é que ela continua sendo escrita, frame por frame, dia após dia. 💫'}},
{t:'Feliz Aniversário! 🎂',r:1,fin:1,f:{p:['fotos/foto (22).jpg','fotos/foto (23).jpg'],ly:'h',m:'Meu amor, hoje é o seu dia e eu queria te dizer tudo que sinto. Nesses 8 anos juntos, você me ensinou o que é amar de verdade. Você é minha melhor amiga, minha companheira, minha paz. Cada dia ao seu lado é um presente. Obrigado por ser quem você é, por me fazer sorrir, por me fazer querer ser alguém melhor. Que esse novo ano da sua vida seja cheio de realizações, saúde e muito amor. Eu te amo mais do que palavras podem dizer. Feliz aniversário, meu amor! Pra sempre nós. ❤️🥂'},b:{end:1}}
];

var N=D.length+1;
var cur=0,mp=0,actx=null,animating=0,closing=0;
var $=function(i){return document.getElementById(i)};
var aud=$('aud');
var PW; // single page width

function sz(){
  var vw=window.innerWidth,vh=window.innerHeight;
  var bh=vh;
  PW=Math.floor(vw/2);
  if(PW>bh*0.75){PW=Math.floor(bh*0.75)}
  var w=$('wrap');
  w.style.height=bh+'px';
  if(cur===0){
    w.style.width=PW+'px';
    w.classList.add('closed');
  } else {
    w.style.width=(PW*2)+'px';
    setTimeout(function(){w.classList.remove('closed')},800);
  }
}

function isVid(s){return/\.(mp4|webm|ogg|mov)$/i.test(s)}

function ph(a,ly){
  return '<div class="pg-grid">'+a.map(function(s,j){
    if(isVid(s))return '<div class="fr"><video src="'+s+'" playsinline muted preload="auto"></video></div>';
    return '<div class="fr"><div class="bb b1"><img src="'+s+'"></div><div class="bb b2"><img src="'+s+'"></div><img src="'+s+'" alt="" loading="lazy"></div>';
  }).join('')+'</div>';
}

function mkPage(d,id,title,rom,fin,side){
  var ly=d.ly||'a';
  var cls='page page-'+side+(rom?' romantic':'')+' ly-'+ly;
  var h='<div class="'+cls+'">';
  h+='<div class="tape t1"></div><div class="tape t2"></div>';
  if(title) h+='<h2 class="pt">'+title+'</h2>';
  else h+='<h2 class="pt" style="visibility:hidden">&nbsp;</h2>';
  h+=ph(d.p,d.ly);
  var fullText=d.m;
  if(fin) h+='<div class="ltr"><div class="pm" id="'+id+'" data-m="'+encodeURIComponent(d.m)+'"><span class="pm-reserve">'+fullText+'</span><span class="pm-text"></span></div></div>';
  else h+='<div class="pm" id="'+id+'" data-m="'+encodeURIComponent(d.m)+'"><span class="pm-reserve">'+fullText+'</span><span class="pm-text"></span></div>';
  h+='</div>';
  return h;
}

function build(){
  var book=$('book');
  book.querySelectorAll('.spread').forEach(function(e){book.removeChild(e)});
  var cornersL = '<div class="gold-corner corner-tl"></div><div class="gold-corner corner-bl"></div>';
  var cornersR = '<div class="gold-corner corner-tr"></div><div class="gold-corner corner-br"></div>';

  for(var i=0;i<N;i++){
    var s=document.createElement('div');
    s.className='spread';s.id='s'+i;
    var fH='',bH='';
    if(i===0){
      fH='<div class="sf"><div class="cover-pg front-c">'+cornersR+'<div class="co">✦</div><h1 class="cn">Meu Amor</h1><div class="cd"></div><h2 class="ct">Nossa História</h2><p class="cs">8 anos de amor</p><button class="bo" id="bo">Abrir Álbum</button></div></div>';
      bH='<div class="sb"><div class="cover-inside ci-l">'+cornersL+'</div>'+mkPage(D[0].f,'m-0-f',D[0].t,D[0].r,0,'l')+'</div>';
    } else if(i<N-1){
      fH='<div class="sf">'+mkPage(D[i-1].b,'m-'+(i-1)+'-b',null,D[i-1].r,0,'r')+'</div>';
      bH='<div class="sb">'+mkPage(D[i].f,'m-'+i+'-f',D[i].t,D[i].r,D[i].fin,'l')+'</div>';
    } else {
      var li=D.length-1;
      if(D[li].b.end){
        fH='<div class="sf"><div class="cover-inside ci-r">'+cornersR+'</div><div class="page page-r" style="justify-content:center"><p style="font-family:Dancing Script,cursive;font-size:1.3rem;color:#8b5e3c">Feito com todo amor do mundo 💕</p><p style="font-size:1.6rem;margin-top:.6rem">🎂🥂💘</p></div></div>';
      } else {
        fH='<div class="sf"><div class="cover-inside ci-r">'+cornersR+'</div>'+mkPage(D[li].b,'m-'+li+'-b',null,D[li].r,0,'r')+'</div>';
      }
      bH='<div class="sb"><div class="cover-pg back-c">'+cornersL+'<p class="et">Nossa História</p><p class="ee">💕</p><div style="margin-top:1.3rem;padding:.6rem 1.5rem;font-size:.85rem;visibility:hidden;border:2px solid transparent">Voltar ao início</div></div></div>';
    }
    s.innerHTML=fH+bH;
    book.appendChild(s);
  }
}

function fixZ(){
  for(var i=0;i<N;i++){
    var s=$('s'+i);
    if(i<cur) s.style.zIndex=i+1;
    else if(i===cur) s.style.zIndex=N;

    var cF=s.querySelector('.sf .cover-pg.front-c');
    if(cF){
      var remR=N-1-i,maxShR=Math.min(remR,12),sh='1px 1px 0px #2a170d, 2px 2px 0px #1a0e07';
      for(var j=1;j<=maxShR;j++)sh+=', '+(j+2)+'px '+(j+2)+'px 0px '+(j%2===0?'#e6dfc8':'#f2ecd9');
      if(remR>0)sh+=', '+(maxShR+3)+'px '+(maxShR+3)+'px 0px #2a170d, '+(maxShR+4)+'px '+(maxShR+4)+'px 0px #1a0e07, '+(maxShR+5)+'px '+(maxShR+5)+'px 15px rgba(0,0,0,0.6)';
      cF.style.boxShadow=sh;
    }
    var f=s.querySelector('.sf .page-r');
    if(f){

      for(var j=1;j<=maxShR;j++)sh+=', '+j+'px '+j+'px 0px '+(j%2===0?'#e6dfc8':'#f2ecd9');
      if(remR>0)sh+=', '+(maxShR+1)+'px '+(maxShR+1)+'px 5px rgba(0,0,0,0.3)';
      f.style.boxShadow=sh;
    }
    var cB=s.querySelector('.sb .cover-pg.back-c');
    if(cB){
      var remL=i,maxShL=Math.min(remL,12),shL='-1px 1px 0px #2a170d, -2px 2px 0px #1a0e07';
      for(var j=1;j<=maxShL;j++)shL+=', '+-(j+2)+'px '+(j+2)+'px 0px '+(j%2===0?'#e6dfc8':'#f2ecd9');
      if(remL>0)shL+=', '+-(maxShL+3)+'px '+(maxShL+3)+'px 0px #2a170d, '+-(maxShL+4)+'px '+(maxShL+4)+'px 0px #1a0e07, '+-(maxShL+5)+'px '+(maxShL+5)+'px 15px rgba(0,0,0,0.6)';
      cB.style.boxShadow=shL;
    }

    if(b){
      var remL=i,maxShL=Math.min(remL,12),shL='inset 15px 0 30px -12px rgba(0,0,0,.2)';
      for(var j=1;j<=maxShL;j++)shL+=', '+-j+'px '+j+'px 0px '+(j%2===0?'#e6dfc8':'#f2ecd9');
      if(remL>0)shL+=', '+-(maxShL+1)+'px '+(maxShL+1)+'px 5px rgba(0,0,0,0.3)';
      b.style.boxShadow=shL;
    }
  }
}

function tw(el){
  if(!el||!el.dataset.m||el._done)return;
  if(el._i)clearInterval(el._i);
  var t=decodeURIComponent(el.dataset.m),n=0;
  var span=el.querySelector('.pm-text');
  if(!span){span=el;}
  span.innerHTML='<span class="cur"></span>';
  el._i=setInterval(function(){
    n++;
    if(n>=t.length){span.textContent=t;clearInterval(el._i);el._i=null;el._done=1}
    else span.innerHTML=t.slice(0,n)+'<span class="cur"></span>';
  },25);
}
function fi(el){
  if(!el||!el.dataset.m)return;
  if(el._i)clearInterval(el._i);
  var span=el.querySelector('.pm-text');
  if(span){span.textContent=decodeURIComponent(el.dataset.m)}
  else el.textContent=decodeURIComponent(el.dataset.m);
  el._done=1;
}

function snd(){
  try{
    if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();
    var sr=actx.sampleRate,len=sr*.14,buf=actx.createBuffer(1,len,sr),ch=buf.getChannelData(0);
    for(var i=0;i<len;i++)ch[i]=(Math.random()*2-1)*Math.pow(1-i/len,3)*.18;
    var s=actx.createBufferSource();s.buffer=buf;
    var f=actx.createBiquadFilter();f.type='lowpass';f.frequency.value=900;
    s.connect(f).connect(actx.destination);s.start();
  }catch(e){}
}

function upd(){
  for(var i=0;i<N;i++){
    var s=$('s'+i);
    if(i<cur){
      s.classList.add('flip');
      s.style.transform='rotateY(-180deg)';
    }else{
      s.classList.remove('flip');
      s.style.transform='rotateY(0deg)';
    }
  }
  fixZ();

  // Don't call sz() when closing (handled by closeBook)
  if(cur<N) sz();

  if(cur>0&&cur<N){
    setTimeout(function(){$('spine').classList.add('show')},850);
  } else if(cur===0){

function fillPast(skipEl){
  for(var i=0;i<N;i++){

function fadeAudio(target,duration,cb){
  var start=aud.volume,diff=target-start,steps=20,step=0;
  var iv=setInterval(function(){
    step++;
    aud.volume=Math.max(0,Math.min(1,start+diff*(step/steps)));
    if(step>=steps){aud.volume=target;clearInterval(iv);if(cb)cb()}
  },duration/steps);
}

function playVisibleVideos(){
  for(var i=0;i<N;i++){
    var s=$('s'+i);
    s.querySelectorAll('video').forEach(function(v){
      var isSF=v.closest('.sf');
      var isSB=v.closest('.sb');
      var visible=false;
      if(isSF&&i===cur) visible=true;
      if(isSB&&i===cur-1) visible=true;
      if(!visible){v.pause();v.currentTime=0;v.classList.remove('playing');v.onended=null;v.volume=0}
    });
  }
  var visVids=[];
  if(cur>0) $('s'+(cur-1)).querySelectorAll('.sb video').forEach(function(v){visVids.push(v)});
  if(cur<N) $('s'+cur).querySelectorAll('.sf video').forEach(function(v){visVids.push(v)});
  function playSeq(idx){
    if(idx>=visVids.length){fadeAudio(1,800);animating=0;return}
    var v=visVids[idx];
    v.currentTime=0;
    v.volume=0;
    v.classList.add('playing');
    fadeAudio(0.15,600);
    v.muted=false;
    v.play().catch(function(){v.muted=true;v.play().catch(function(){})});
    // Limit video to 15 seconds
    var maxTime=15;
    var timeCheck=setInterval(function(){if(v.currentTime>=maxTime){clearInterval(timeCheck);v.dispatchEvent(new Event('ended'))}},200);
    // Fade in video volume
    var vs=0,viv=setInterval(function(){vs++;v.volume=Math.min(1,vs/20);if(vs>=20)clearInterval(viv)},30);
    if(idx>0){
      var elR=cur<N?$('s'+cur).querySelector('.sf .pm'):null;
      if(elR&&!elR._done)tw(elR);
    }
    v.onended=function(){
      clearInterval(timeCheck);
      // Fade out video volume
      var vo=20,vov=setInterval(function(){vo--;v.volume=Math.max(0,vo/20);if(vo<=0){clearInterval(vov);v.classList.remove('playing');playSeq(idx+1)}},30);
    };
  }
  if(visVids.length>0) playSeq(0);
  else fadeAudio(1,600);
}

function pageHasVideos(){
  var has=false;

  if(cur<N) {var s=$('s'+cur);if(s.querySelector('.sf video'))has=true}
  return has;
}

    if(cur>0&&cur<N){

        } else {
          var tL=decodeURIComponent(elL.dataset.m);
          var waitL=tL.length*25+200;
          setTimeout(function(){
            if(elR&&!elR._done){
              tw(elR);
              var tR=decodeURIComponent(elR.dataset.m);
              setTimeout(function(){animating=0},tR.length*25+200);
            } else {
              if(elR)fi(elR);
              animating=0;
            }
          },waitL);
        }
      } else {
        if(elL)fi(elL);
        if(hasVid){
          // keep animating=1, playVisibleVideos releases it
        } else {
          if(elR&&!elR._done){
            tw(elR);

var BLUR_PCT=0.15;
function applyBlur(){
  document.querySelectorAll('.fr').forEach(function(fr){
    var d1=fr.querySelector('.b1'),d2=fr.querySelector('.b2');
    var img=fr.querySelector(':scope>img');
    if(!d1||!d2||!img||!img.naturalWidth){if(d1)d1.style.display='none';if(d2)d2.style.display='none';return}
    fr.style.maxHeight='';
    fr.style.maxWidth='';
    var fw=fr.offsetWidth,fh=fr.offsetHeight,iw=img.naturalWidth,ih=img.naturalHeight,p=40;
    if(!fw||!fh){d1.style.display='none';d2.style.display='none';return}
    var blurCSS='position:absolute;object-fit:cover;filter:blur(20px) brightness(.85);';
    var i1=d1.querySelector('img'),i2=d2.querySelector('img');
    if(ih>iw){
      // retrato: gap nas laterais
      var rw=fh*(iw/ih);
      var gap=(fw-rw)/2;
      var maxGap=rw*BLUR_PCT;
      if(gap>maxGap){
        // limitar: reduzir largura do fr
        var newFw=rw+maxGap*2;
        fr.style.maxWidth=newFw+'px';
        fw=fr.offsetWidth;
        rw=fh*(iw/ih);
        gap=(fw-rw)/2;
      }
      if(gap<3){d1.style.display='none';d2.style.display='none';return}
      var fullW=(fw+p*2)+'px',fullH=(fh+p*2)+'px';
      d1.style.cssText='position:absolute;overflow:hidden;z-index:0;pointer-events:none;top:0;left:0;width:'+Math.ceil(gap)+'px;height:'+fh+'px';
      i1.style.cssText=blurCSS+'top:-'+p+'px;left:-'+p+'px;width:'+fullW+';height:'+fullH;
      d2.style.cssText='position:absolute;overflow:hidden;z-index:0;pointer-events:none;top:0;right:0;width:'+Math.ceil(gap)+'px;height:'+fh+'px';
      i2.style.cssText=blurCSS+'top:-'+p+'px;right:-'+p+'px;width:'+fullW+';height:'+fullH;
    } else {
      // paisagem: gap em cima e embaixo
      var rh=fw*(ih/iw);
      var gap=(fh-rh)/2;
      var maxGap=rh*BLUR_PCT;
      if(gap>maxGap){
        var newFh=rh+maxGap*2;
        fr.style.maxHeight=newFh+'px';
        fh=fr.offsetHeight;
        rh=fw*(ih/iw);
        gap=(fh-rh)/2;
      }
      if(gap<3){d1.style.display='none';d2.style.display='none';return}
      var fullW=(fw+p*2)+'px',fullH=(fh+p*2)+'px';
      d1.style.cssText='position:absolute;overflow:hidden;z-index:0;pointer-events:none;top:0;left:0;width:'+fw+'px;height:'+Math.ceil(gap)+'px';
      i1.style.cssText=blurCSS+'top:-'+p+'px;left:-'+p+'px;width:'+fullW+';height:'+fullH;
      d2.style.cssText='position:absolute;overflow:hidden;z-index:0;pointer-events:none;bottom:0;left:0;width:'+fw+'px;height:'+Math.ceil(gap)+'px';
      i2.style.cssText=blurCSS+'bottom:-'+p+'px;left:-'+p+'px;width:'+fullW+';height:'+fullH;
    }
  });
}
document.querySelectorAll('.fr>img').forEach(function(img){
  img.addEventListener('load',applyBlur);
  if(img.complete)setTimeout(applyBlur,50);
});
window.addEventListener('resize',applyBlur);

document.addEventListener('click',function(e){if(e.target.closest('#bo'))openBook()});
$('bm').addEventListener('click',togM);
$('br').addEventListener('click',restart);
$('bReopen').addEventListener('click',restart);
window.addEventListener('resize',function(){if(cur<N)sz()});
document.addEventListener('fullscreenchange',function(){setTimeout(function(){if(cur<N)sz()},100)});

var sx=0,sy=0,dragging=false;
document.addEventListener('touchstart',function(e){sx=e.changedTouches[0].screenX;sy=e.changedTouches[0].screenY},{passive:1});
document.addEventListener('touchend',function(e){var dx=e.changedTouches[0].screenX-sx;var dy=e.changedTouches[0].screenY-sy;if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>50){if(cur===0){openBook()}else if(dx<0){next()}else{prev()}}},{passive:1});
document.addEventListener('mousedown',function(e){if(e.target.closest('button'))return;sx=e.screenX;sy=e.screenY;dragging=true});
document.addEventListener('mouseup',function(e){if(!dragging)return;dragging=false;var dx=e.screenX-sx;var dy=e.screenY-sy;if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>50){if(cur===0){openBook()}else if(dx<0){next()}else{prev()}}});
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'){if(cur===0)openBook();else next()}if(e.key==='ArrowLeft')prev()});
</script>
