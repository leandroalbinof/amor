<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Nossa História 💕</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Caveat:wght@400;700&family=Poppins:wght@300;400;600&display=swap"
    rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at center, #2a1b12 0%, #050302 100%);
      margin: 0
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center
    }

    html::-webkit-scrollbar {
      display: none
    }

    .wrap {
      perspective: 1500px;
      position: relative;
      transition: width .8s, height .8s;
      user-select: none;
      /* Ensure shadows are visible even when book is near screen edges */
      overflow: visible;
    }

    .wrap.closed #s0 {
      width: 100%
    }

    .wrap.closed .spread:not(#s0) {
      visibility: hidden
    }

    .book {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d
    }

    .spread {
      position: absolute;
      top: 0;
      right: 0;
      width: 50%;
      height: 100%;
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform 1.2s cubic-bezier(.4, .05, .2, 1)
    }

    .spread.flip {
      transform: rotateY(-180deg)
    }

    .sf,
    .sb {
      position: absolute;
      inset: 0;
      backface-visibility: hidden
    }

    .sf {
      z-index: 2
    }

    .sb {
      transform: rotateY(180deg)
    }

    .page {
      position: absolute;
      height: 97%;
      width: 98%;
      top: 1.5%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0.8rem 0.7rem;
      overflow: hidden
    }

    .page .pg-grid {
      flex: 1 1 0;
      min-height: 0;
      overflow: hidden
    }

    .page .pm {
      flex-shrink: 0;
      z-index: 3
    }

    .page .ltr {
      flex-shrink: 0;
      z-index: 3
    }

    .page .pt {
      flex-shrink: 0;
      z-index: 3
    }

    .page-r {
      left: 0;
      border-radius: 0 4px 4px 0;
      background: url('assets/paper.png') center/cover;
      box-shadow: inset 30px 0 40px -10px rgba(0, 0, 0, 0.3)
    }

    .page-l {
      right: 0;
      border-radius: 4px 0 0 4px;
      background: url('assets/paper.png') center/cover;
      box-shadow: inset -30px 0 40px -10px rgba(0, 0, 0, 0.3)
    }

    .page.romantic.page-r {
      background: url('assets/paper.png') center/cover
    }

    .page.romantic.page-l {
      background: url('assets/paper.png') center/cover
    }

    .sf::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 25px;
      background: linear-gradient(to right, rgba(0, 0, 0, .05), transparent);
      pointer-events: none;
      z-index: 10
    }

    .sb::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 25px;
      background: linear-gradient(to left, rgba(0, 0, 0, .05), transparent);
      pointer-events: none;
      z-index: 10
    }

    .cover-pg {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #fdf6ee;
      padding: 1.5rem 1rem;
      background: url('assets/leather.png') center/cover;
      position: relative;
      overflow: hidden;
      width: 100%;
      height: 100%
    }

    .cover-pg.front-c {
      border-radius: 0 4px 4px 0
    }

    .cover-pg.back-c {
      border-radius: 4px 0 0 4px
    }

    .cover-pg::before {
      content: '';
      position: absolute;
      inset: 8px;
      border: 2px dashed rgba(255, 255, 255, 0.4);
      pointer-events: none;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5)
    }

    .cover-inside {
      position: absolute;
      inset: 0;
      background: url('assets/leather.png') center/cover;
      box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.9)
    }

    .cover-inside::before {
      content: '';
      position: absolute;
      inset: 8px;
      border: 2px dashed rgba(255, 255, 255, 0.4);
      pointer-events: none
    }

    .ci-r {
      box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.9), 1px 1px 0px #2a170d, 2px 2px 0px #1a0e07, 3px 3px 6px rgba(0, 0, 0, 0.6)
    }

    .ci-l {
      box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.9), -1px 1px 0px #2a170d, -2px 2px 0px #1a0e07, -3px 3px 6px rgba(0, 0, 0, 0.6)
    }

    .gold-corner {
      position: absolute;
      width: 45px;
      height: 45px;
      background: url('assets/gold.png') center/cover;
      box-shadow: inset 1px 1px 2px rgba(255, 255, 255, 0.4), inset -1px -1px 3px rgba(0, 0, 0, 0.7), 2px 2px 5px rgba(0, 0, 0, 0.8);
      z-index: 10
    }

    .corner-tl {
      top: 0;
      left: 0;
      clip-path: polygon(0 0, 100% 0, 0 100%)
    }

    .corner-tr {
      top: 0;
      right: 0;
      clip-path: polygon(0 0, 100% 0, 100% 100%)
    }

    .corner-bl {
      bottom: 0;
      left: 0;
      clip-path: polygon(0 0, 100% 100%, 0 100%)
    }

    .corner-br {
      bottom: 0;
      right: 0;
      clip-path: polygon(100% 0, 100% 100%, 0 100%)
    }

    .cn {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(1.5rem, 8vw, 3.5rem);
      font-weight: 700;
      text-shadow: 2px 3px 6px rgba(0, 0, 0, .4);
      position: relative;
      color: #f0e68c
    }

    .cd {
      width: 90px;
      height: 2px;
      margin: .7rem auto;
      background: linear-gradient(90deg, transparent, #fdf6ee, transparent);
      position: relative
    }

    .ct {
      font-family: 'Caveat', cursive;
      font-size: clamp(1.4rem, 4.5vw, 2.2rem);
      opacity: .9;
      position: relative
    }

    .cs {
      font-size: .8rem;
      opacity: .6;
      margin-top: .3rem;
      font-style: italic;
      position: relative
    }

    .co {
      font-size: 1.5rem;
      opacity: .5;
      letter-spacing: .6rem;
      margin-bottom: .6rem;
      position: relative
    }

    .bo {
      margin-top: 1.3rem;
      padding: .6rem 1.2rem;
      background: rgba(255, 255, 255, .1);
      border: 2px solid rgba(255, 255, 255, .3);
      color: #fdf6ee;
      font-family: 'Poppins', sans-serif;
      font-size: .8rem;
      border-radius: 50px;
      cursor: pointer;
      transition: all .3s;
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .4rem;
      overflow: hidden;
      max-width: 90%;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .bo:disabled {
      cursor: wait;
      opacity: 0.8;
      border-color: rgba(255, 255, 255, 0.1);
    }

    .bo .progress {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0%;
      background: rgba(255, 255, 255, 0.2);
      transition: width 0.3s;
      z-index: 0;
    }

    .bo span {
      position: relative;
      z-index: 1;
    }

    .bo:hover:not(:disabled) {
      background: rgba(255, 255, 255, .3);
      transform: scale(1.05)
    }

    @keyframes gl {
      0%, 100% {
        box-shadow: 0 0 12px rgba(255, 255, 255, 0.2), inset 0 0 0px rgba(255, 255, 255, 0);
      }
      50% {
        box-shadow: 0 0 25px rgba(255, 255, 255, 0.5), inset 0 0 8px rgba(255, 255, 255, 0.3);
        transform: scale(1.03);
      }
    }

    .bo .progress::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      animation: shimmer 1.5s infinite;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .page-lighting {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 100;
      mix-blend-mode: multiply;
      opacity: 0
    }

    .left-lighting {
      background: linear-gradient(to right, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.1) 30%, rgba(0, 0, 0, 0.3) 50%, rgba(0, 0, 0, 0) 100%);
      background-size: 200% 100%;
      animation: sweepLeft 1.2s ease-in-out
    }

    .right-lighting {
      background: linear-gradient(to right, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.3) 50%, rgba(0, 0, 0, 0.1) 70%, rgba(0, 0, 0, 0) 100%);
      background-size: 200% 100%;
      animation: sweepRight 1.2s ease-in-out
    }

    .page-highlight {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 101;
      mix-blend-mode: overlay;
      opacity: 0
    }

    .left-highlight {
      background: linear-gradient(to right, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.4) 45%, rgba(255, 255, 255, 0.8) 50%, rgba(255, 255, 255, 0.4) 55%, rgba(255, 255, 255, 0) 100%);
      background-size: 200% 100%;
      animation: sweepLeft 1.2s ease-in-out
    }

    .right-highlight {
      background: linear-gradient(to right, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.4) 45%, rgba(255, 255, 255, 0.8) 50%, rgba(255, 255, 255, 0.4) 55%, rgba(255, 255, 255, 0) 100%);
      background-size: 200% 100%;
      animation: sweepRight 1.2s ease-in-out
    }

    @keyframes sweepLeft {
      0% {
        opacity: 0;
        background-position: 100% 0
      }

      20% {
        opacity: 0.8
      }

      80% {
        opacity: 0.8
      }

      100% {
        opacity: 0;
        background-position: -100% 0
      }
    }

    @keyframes sweepRight {
      0% {
        opacity: 0;
        background-position: -100% 0
      }

      20% {
        opacity: 0.8
      }

      80% {
        opacity: 0.8
      }

      100% {
        opacity: 0;
        background-position: 100% 0
      }
    }

    /* Back cover overlay */
    .backcover {
      position: absolute;
      top: 0;
      width: 50%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #fdf6ee;
      padding: 1.5rem 1rem;
      background: url('assets/leather.png') center/cover;
      border-radius: 4px 0 0 4px;
      z-index: 10000;
      opacity: 0;
      pointer-events: none;
      left: 50%;
      box-shadow: -1px 1px 0px #2a170d, -2px 2px 0px #1a0e07, -3px 3px 0px #f2ecd9, -4px 4px 0px #e6dfc8, -5px 5px 0px #f2ecd9, -6px 6px 0px #e6dfc8, -7px 7px 0px #f2ecd9, -8px 8px 0px #e6dfc8, -9px 9px 0px #f2ecd9, -10px 10px 0px #2a170d, -11px 11px 0px #1a0e07, -12px 12px 15px rgba(0, 0, 0, 0.6)
    }

    .backcover::before {
      content: '';
      position: absolute;
      inset: 8px;
      border: 2px dashed rgba(255, 255, 255, 0.4);
      pointer-events: none;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5)
    }

    .backcover.show {
      opacity: 1;
      pointer-events: auto
    }

    .spine {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 120px;
      margin-left: -60px;
      background: linear-gradient(90deg, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.05) 20%, rgba(0, 0, 0, 0.3) 45%, rgba(0, 0, 0, 0.85) 49%, rgba(0, 0, 0, 0.95) 50%, rgba(0, 0, 0, 0.85) 51%, rgba(0, 0, 0, 0.3) 55%, rgba(0, 0, 0, 0.05) 80%, rgba(0, 0, 0, 0) 100%);
      z-index: 9999;
      opacity: 0;
      transition: opacity .5s;
      pointer-events: none;
      mix-blend-mode: multiply
    }

    .spine.show {
      opacity: 0.85
    }

    .tape {
      display: none
    }

    .t1 {
      top: 8px;
      left: 8px
    }

    .t2 {
      top: 8px;
      right: 8px
    }

    .pt {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(1.3rem, 4vw, 2.2rem);
      color: #2a1b12;
      margin-bottom: .4rem;
      text-align: center;
      font-weight: 700
    }

    .pg-grid {
      display: flex;
      flex-direction: column;
      gap: .4rem;
      width: 100%;
      margin-bottom: .4rem;
      flex: 1;
      min-height: 0;
      justify-content: center;
    }

    .pg-grid>.fr {
      flex: 1;
      min-height: 0;
    }

    /* Layout override: use flex rows/cols instead of rigid grid */
    .ly-b .pg-grid,
    .ly-d .pg-grid,
    .ly-i .pg-grid {
      flex-direction: row;
    }

    @media(max-width:800px) {

      .ly-b .pg-grid,
      .ly-d .pg-grid,
      .ly-i .pg-grid {
        flex-direction: column;
      }
    }

    @media(max-width:500px) {
      .ly-b .pg-grid {
        grid-template-columns: 1fr
      }
    }

    .ly-c .pg-grid {
      grid-template-columns: 1fr;
      gap: .5rem
    }

    .ly-c .fr:nth-child(2) {
      margin: 0 12% 0 12%
    }

    .ly-d .pg-grid {
      grid-template-columns: 1fr 1fr;
      gap: .5rem;
      align-items: end
    }

    @media(max-width:500px) {
      .ly-d .pg-grid {
        grid-template-columns: 1fr
      }
    }

    .ly-d .fr:nth-child(2) {
      margin-top: -10%
    }

    .ly-e .pg-grid {
      flex-direction: column;
      gap: 1.5rem;
      justify-content: center;
      align-items: center;
      flex: 1;
    }

    .ly-e .fr {
      flex: 0 0 auto;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      box-shadow: none;
      border: none;
      overflow: hidden;
      width: 200px;
      /* JS will override this */
      height: 200px;
    }

    .ly-e .fr:nth-child(2) {
      margin: 0 auto;
    }

    @media(max-width:500px) {
      .ly-e .fr {
        gap: 0.8rem;
      }
    }

    .ly-e .fr>img,
    .ly-e .fr video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%
    }

    .ly-f .pg-grid {
      grid-template-columns: 1fr;
      gap: .5rem
    }

    .ly-f .fr:nth-child(2) {
      margin-left: 8%
    }

    .ly-g .pg-grid {
      grid-template-columns: 1fr;
      gap: 0
    }

    .ly-g .fr:nth-child(2) {
      margin-top: -15%;
      margin-left: 25%
    }

    .ly-h .pg-grid {
      grid-template-columns: 1fr;
      gap: .5rem
    }

    .ly-i .pg-grid {
      grid-template-columns: 1fr 1fr;
      gap: .4rem
    }

    @media(max-width:500px) {
      .ly-i .pg-grid {
        grid-template-columns: 1fr
      }
    }

    .ly-j .pg-grid {
      grid-template-columns: 1fr;
      gap: .4rem
    }

    .ly-k .pg-grid {
      grid-template-columns: 1fr;
      gap: .5rem
    }

    .ly-k .fr:nth-child(odd) {
      margin-right: 15%
    }

    .ly-k .fr:nth-child(even) {
      margin-left: 15%
    }

    .ly-l .pg-grid {
      grid-template-columns: 1fr;
      gap: .5rem
    }

    .fr {
      overflow: visible;
      transition: transform .4s;
      padding: 0;
      position: relative;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      min-width: 0
    }

    .fr:hover {
      transform: scale(1.02) !important;
      z-index: 2
    }

    .fr>img {
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      position: relative;
      z-index: 1;
      background: #fff;
      border: 4px solid #fdfaf6;
      border-radius: 4px;
      box-shadow: 2px 3px 6px rgba(0, 0, 0, 0.4)
    }

    .fr video {
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      background: #000;
      border: 4px solid #fdfaf6;
      border-radius: 4px;
      box-shadow: 2px 3px 6px rgba(0, 0, 0, 0.4);
      z-index: 1
    }

    .upside-down {
      transform: rotate(180deg) !important;
    }

    .reflected {
      transform: scaleX(-1) !important;
    }

    .fr::after {
      display: none
    }

    .fr .bb {
      display: none
    }

    .tl {
      transform: rotate(-2deg)
    }

    .tr {
      transform: rotate(2deg)
    }

    .pm {
      font-family: 'Caveat', cursive;
      font-size: clamp(1.1rem, 2.5vw, 1.3rem);
      color: #1a0f08;
      text-align: left;
      line-height: 1.4;
      min-height: 1rem;
      width: 100%;
      text-indent: 1.5em;
      position: relative;
      font-weight: 700
    }

    .pm .pm-reserve {
      visibility: hidden
    }

    .pm .pm-text {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      text-indent: 1.5em
    }

    .cur {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: #1a0f08;
      margin-left: 1px;
      animation: bk .7s infinite;
      vertical-align: text-bottom
    }

    @keyframes bk {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: 0
      }
    }

    .ltr {
      background: rgba(255, 255, 255, .5);
      border: 1px dashed #d4a0c0;
      border-radius: 6px;
      padding: .5rem;
      width: 100%
    }

    .balao {
      position: absolute;
      bottom: -100px;
      width: 40px;
      height: 50px;
      border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
      z-index: 100;
      animation: subir 4s ease-in forwards;
      opacity: 0.8;
      pointer-events: none;
    }

    .balao::before {
      content: "";
      position: absolute;
      bottom: -10px;
      left: 18px;
      width: 4px;
      height: 10px;
      background: rgba(0,0,0,0.1);
    }

    .balao::after {
      content: "";
      position: absolute;
      bottom: -30px;
      left: 19px;
      width: 2px;
      height: 30px;
      background: #ccc;
    }

    @keyframes subir {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-120vh) rotate(20deg); opacity: 0; }
    }

    .ltr .pm {
      font-size: clamp(.68rem, 1.6vw, .82rem);
      text-align: left
    }

    .et {
      font-family: 'Dancing Script', cursive;
      font-size: 1.3rem;
      color: #fdf6ee;
      position: relative
    }

    .ee {
      font-size: 1.6rem;
      margin-top: .6rem;
      position: relative
    }

    .nav {
      display: flex;
      align-items: center;
      gap: .7rem;
      margin-top: .7rem;
      z-index: 200
    }

    .nb {
      width: 44px;
      height: 44px;
      background: rgba(255, 255, 255, .1);
      border: 1px solid rgba(255, 255, 255, .15);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .3s;
      color: #ccc
    }

    .nb:hover:not(:disabled) {
      background: rgba(255, 255, 255, .2);
      color: #fff;
      transform: scale(1.1)
    }

    .nb:disabled {
      opacity: .15;
      cursor: default
    }

    .pi {
      font-family: 'Caveat', cursive;
      font-size: 1rem;
      color: rgba(255, 255, 255, .6);
      min-width: 100px;
      text-align: center
    }

    .ctrl {
      position: fixed;
      top: .7rem;
      right: .7rem;
      z-index: 200;
      display: flex;
      gap: .4rem
    }

    .cb {
      width: 38px;
      height: 38px;
      background: rgba(255, 255, 255, .12);
      border: 1px solid rgba(255, 255, 255, .15);
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .3s;
      color: #fff
    }

    .cb:hover {
      background: rgba(255, 255, 255, .25);
      transform: scale(1.1)
    }

    .cb.on {
      background: rgba(212, 160, 192, .3)
    }

    .bsh {
      width: 70%;
      height: 20px;
      background: radial-gradient(ellipse, rgba(0, 0, 0, .3), transparent);
      border-radius: 50%;
      filter: blur(5px);
      margin-top: .2rem
    }

    .page::-webkit-scrollbar {
      width: 3px
    }

    .page::-webkit-scrollbar-thumb {
      background: #d4c0a8;
      border-radius: 3px
    }

    @media(max-width:800px) {
      .page {
        padding: 0.5rem 0.4rem;
      }

          bg1.style.cssText = blurCSS + 'top:-' + p + 'px;left:-' + p + 'px;width:' + fullW + ';height:' + fullH;
          d2.style.cssText = 'position:absolute;overflow:hidden;z-index:0;pointer-events:none;bottom:0;left:0;width:' + fw + 'px;height:' + Math.ceil(gap) + 'px';
          bg2.style.cssText = blurCSS + 'bottom:-' + p + 'px;left:-' + p + 'px;width:' + fullW + ';height:' + fullH;
        }
      });
    }
    function fixCirc() {
      document.querySelectorAll('.ly-e .fr').forEach(function (fr) {
        var p = fr.parentElement;
        if (!p) return;
        var pw = p.offsetWidth, ph = p.offsetHeight;
        if (!pw || !ph) return;
        // More aggressive sizing: use up to 98% of width or 48% of height
        var size = Math.min(pw * 0.95, ph * 0.47);
        if (window.innerWidth < 500) size = Math.min(pw * 0.98, ph * 0.48);
        fr.style.width = Math.floor(size) + 'px';
        fr.style.height = Math.floor(size) + 'px';
      });
    }

    document.querySelectorAll('.fr>img').forEach(function (img) {
      img.addEventListener('load', function () { applyBlur(); fixCirc(); });
      if (img.complete) setTimeout(function () { applyBlur(); fixCirc(); }, 50);
    });
    window.addEventListener('resize', function () { applyBlur(); fixCirc(); });

    build();

    // Attach listeners only AFTER build() has created the buttons
    document.addEventListener('click', function (e) { if (e.target.closest('#bo')) { openBook(); setTimeout(fixCirc, 100); } });
    if ($('bm')) $('bm').addEventListener('click', togM);
    if ($('bReopen')) $('bReopen').addEventListener('click', restart);
    function loadAssets() {
      var assets = new Set();
      D.forEach(function (p) {
        if (p.f && p.f.p) p.f.p.forEach(function (u) { assets.add(u) });
        if (p.b && p.b.p) p.b.p.forEach(function (u) { assets.add(u) });
      });
      assets.add('musica/musica.mp3');
      assets.add('assets/leather.png');
      assets.add('assets/paper.png');
      assets.add('assets/gold.png');

      var total = assets.size, loaded = 0, btn = $('bo'), lp = $('lp');
      if (total === 0) {
        if (btn) { btn.disabled = false; btn.querySelector('span').textContent = 'Abrir Álbum'; btn.style.animation = 'gl 2s infinite'; }
        return;
      }

      function update() {
        loaded++;
        var pct = Math.floor((loaded / total) * 100);
        if (lp) lp.style.width = pct + '%';
        if (btn) btn.querySelector('span').textContent = 'Carregando ' + pct + '%';
        if (loaded >= total) {
          setTimeout(function () {
            if (btn) {
              btn.querySelector('span').textContent = 'Abrir Álbum';
              btn.disabled = false;
              btn.style.animation = 'gl 2s infinite';
            }
          }, 500);
        }
      }

      assets.forEach(function (u) {
        if (isVid(u)) {
          var v = document.createElement('video');
          v.preload = 'auto';
          v.oncanplaythrough = function() { if(!v._done) { v._done=1; update(); } };
          v.onerror = function() { if(!v._done) { v._done=1; update(); } };
          v.src = u;
          v.load();
        } else if (/\.(mp3|wav|ogg)$/i.test(u)) {
          var au = new Audio();
          au.preload = 'auto';
          au.oncanplaythrough = function() { if(!au._done) { au._done=1; update(); } };
          au.onerror = function() { if(!au._done) { au._done=1; update(); } };
          au.src = u;
          au.load();
        } else {
          var img = new Image();
          img.onload = update;
          img.onerror = update;
          img.src = u;
        }
      });
      setTimeout(function () { if (btn && btn.disabled) { btn.disabled = false; btn.querySelector('span').textContent = 'Abrir Álbum'; btn.style.animation = 'gl 2s infinite'; } }, 30000);
    }

    function restart() {
      if (animating) return;
      cur = 0; animating = 0; closing = 0;
      var w = $('wrap');
      w.style.transition = 'none';
      w.style.transform = 'translateX(0)';
      w.style.width = PW + 'px';
      w.classList.add('closed');

      for (var i = 0; i < N; i++) {
        var s = $('s' + i);
        s.style.display = '';
        s.style.transition = 'none';
        s.style.transform = '';
        s.style.visibility = '';
        s.classList.remove('flip');
      }
      $('bc').classList.remove('show');
      $('spine').classList.remove('show');
      $('ctrl').style.visibility = 'hidden';
      if (aud) { aud.pause(); aud.currentTime = 0; $('bm').classList.remove('on'); }
      sz();
      fixZ();
      // Restore cover button to "Abrir" state if needed
      var btn = $('bo');
      if (btn) {
        btn.disabled = false;
        btn.querySelector('span').textContent = 'Abrir Álbum';
        btn.style.animation = 'gl 2s infinite';
        mkB($('s0'));
      }
    }
    function togM() {
      if (aud.paused) { aud.play().catch(function () { }); $('bm').classList.add('on'); }
      else { aud.pause(); $('bm').classList.remove('on'); }
    }

    var timerIv = null;
    function updateTimer() {
      if (timerIv) clearInterval(timerIv);
      var birth = new Date(1994, 4, 15, 0, 0, 0); // Month is 0-indexed, so 4 = May
      function calc() {
        var now = new Date();
        var diff = now - birth;
        var yy = Math.floor(diff / (1000 * 60 * 60 * 24 * 365.25));
        var dd = Math.floor(diff / (1000 * 60 * 60 * 24));
        var hh = Math.floor(diff / (1000 * 60 * 60));
        var mm = Math.floor(diff / (1000 * 60));
        var ss = Math.floor(diff / 1000);

        if ($('t-yy')) $('t-yy').textContent = yy.toLocaleString();
        if ($('t-dd')) $('t-dd').textContent = dd.toLocaleString();
        if ($('t-hh')) $('t-hh').textContent = hh.toLocaleString();
        if ($('t-mm')) $('t-mm').textContent = mm.toLocaleString();
      }
      calc();
      timerIv = setInterval(calc, 1000);
    }

    loadAssets();
    fixZ();
    if ($('bm')) $('bm').addEventListener('click', togM);
    if ($('bReopen')) $('bReopen').addEventListener('click', restart);
    window.addEventListener('resize', function () { if (cur < N) { sz(); fixCirc(); fixZ(); } });
    document.addEventListener('fullscreenchange', function () {
      // Multi-step check to catch the final viewport size on mobile
      [100, 300, 600, 1000].forEach(function (d) {
        setTimeout(function () { if (cur < N) { sz(); fixCirc(); fixZ(); } }, d);
      });
    });

    var sx = 0, sy = 0, dragging = false;
    document.addEventListener('touchstart', function (e) { sx = e.changedTouches[0].screenX; sy = e.changedTouches[0].screenY }, { passive: 1 });
    document.addEventListener('touchend', function (e) { var dx = e.changedTouches[0].screenX - sx; var dy = e.changedTouches[0].screenY - sy; if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) { if (cur === 0) { openBook() } else if (dx < 0) { next() } else { prev() } } }, { passive: 1 });
    document.addEventListener('mousedown', function (e) { if (e.target.closest('button')) return; sx = e.screenX; sy = e.screenY; dragging = true });
    document.addEventListener('mouseup', function (e) { if (!dragging) return; dragging = false; var dx = e.screenX - sx; var dy = e.screenY - sy; if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) { if (cur === 0) { openBook() } else if (dx < 0) { next() } else { prev() } } });
    document.addEventListener('keydown', function (e) { if (e.key === 'ArrowRight') { if (cur === 0) openBook(); else next() } if (e.key === 'ArrowLeft') prev() });
  </script>
</body>
